mutation CreateStrategy($createStrategyInput: CreateStrategyInput) {
  createStrategy(createStrategyInput: $createStrategyInput)
}

mutation DeleteStrategy($deleteStrategyId: ID!) {
  deleteStrategy(id: $deleteStrategyId)
}

mutation UpdateStrategyDetails(
  $updateStrategyInput: UpdateStrategyDetailsInput
) {
  updateStrategyDetails(updateStrategyInput: $updateStrategyInput)
}

mutation UpdateStrategyStats(
  $updateStrategyStatsInput: UpdateStrategyStatsInput
) {
  updateStrategyStats(updateStrategyStatsInput: $updateStrategyStatsInput)
}

mutation ResetStrategyStats($resetStrategyStatsId: ID!) {
  resetStrategyStats(id: $resetStrategyStatsId)
}

mutation UndoLastStrategyStats($undoLastStrategyStatsId: ID!) {
  undoLastStrategyStats(id: $undoLastStrategyStatsId)
}